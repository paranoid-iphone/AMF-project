[project]
name = "amf-backend"
version = "0.1.0"
description = "AMF Django API foundation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "Django>=5.2,<5.3",
  "djangorestframework>=3.16,<3.17",
  "drf-spectacular>=0.28,<0.29",
  "psycopg[binary]>=3.2,<3.3",
]

[dependency-groups]
dev = [
  "django-stubs>=5.2,<5.3",
  "djangorestframework-stubs>=3.16,<3.17",
  "mypy>=1.18,<1.19",
  "pytest>=8.4,<9",
  "pytest-django>=4.11,<5",
  "ruff>=0.13,<0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
exclude = ["accounts/migrations/", "projects/migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings"
strict_settings = true
[tool.ruff.lint.per-file-ignores]
"accounts/migrations/*.py" = ["E501"]
"projects/migrations/*.py" = ["E501"]
