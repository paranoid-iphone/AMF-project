          description: ''
  /api/auth/password-reset/request/:
    post:
      operationId: auth_password_reset_request_create
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: Current csrftoken cookie value for every unsafe request.
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: Current csrftoken cookie value for every unsafe request.
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/auth/session/:
    get:
      operationId: auth_session_retrieve
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnavailableHealth'
          description: ''
components:
  schemas:
    Accepted:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/AcceptedStatusEnum'
      required:
      - status
    AcceptedStatusEnum:
      enum:
      - accepted
      type: string
      description: '* `accepted` - accepted'
    CodeEnum:
      enum:
      - validation_error
      - invalid_credentials
      - invalid_invitation
      - invalid_or_expired_token
      - not_authenticated
      - csrf_failed
      - email_verification_required
      - rate_limited
      type: string
      description: |-
        * `validation_error` - validation_error
        * `invalid_credentials` - invalid_credentials
        * `invalid_invitation` - invalid_invitation
        * `invalid_or_expired_token` - invalid_or_expired_token
        * `not_authenticated` - not_authenticated
        * `csrf_failed` - csrf_failed
        * `email_verification_required` - email_verification_required
        * `rate_limited` - rate_limited
    ErrorDetail:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/CodeEnum'
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/ErrorItem'
      required:
      - code
      - message
    ErrorEnvelope:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
    ErrorItem:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
      - code
      - message
    Health:
      type: object
      properties:
        status:
          type: string
          readOnly: true
        database:
          type: string
          readOnly: true
      required:
      - database
      - status
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    PasswordResetConfirmRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
        token:
          type: string
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - new_password
      - token
      - uid
    PasswordResetRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    RegisterRequest:
      type: object
      properties:
        invitation_token:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - invitation_token
      - password
    Session:
      type: object
      properties:
        authenticated:
          type: boolean
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          nullable: true
      required:
      - authenticated
      - user
    TokenRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
      required:
      - token
    UnavailableHealth:
      type: object
      properties:
        status:
          type: string
          readOnly: true
        database:
          type: string
          readOnly: true
      required:
      - database
      - status
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        email_verified:
          type: boolean
          readOnly: true
      required:
      - email
      - email_verified
      - id
    UserEnvelope:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
      required:
      - user
    Verified:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/VerifiedStatusEnum'
      required:
      - status
    VerifiedStatusEnum:
      enum:
      - verified
      type: string
      description: '* `verified` - verified'
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
